[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "SasWebCalc"
version = "1.0.1"
requires-python = "< 3.13"
authors = [
    {name = "Brian Maranville", email = 'brian.maranville@nist.gov'},
    {name = "Jack Campbell"}
]
maintainers = [
    {name = "Jeff Krzywon", email = 'jkrzywon@nist.gov'},
]
description = 'A web-based small-angle scattering (SAS) tool for calculating theoretical I vs. Q and 2D scattering patterns based off an instrumental configuration and SAS model.'
readme = {file = "README.md", content-type = "text/markdown"}
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["webcalc"]
include = ['python', 'static*', 'templates*', '*.css', '*.js', '*.html', '*.doctree', '*.pickle']

[project.urls]
Repository = 'https://gitlab.nist.gov/gitlab/jkrzywon/saswebcalc.git'
Issues = 'https://gitlab.nist.gov/gitlab/jkrzywon/saswebcalc/-/issues'

[project.optional-dependencies]
webcalc = ['numpy', 'flask', 'sasmodels', 'gunicorn']

[project.scripts]
webcalc-dev = "webcalc:main"
webcalc-prod = "wsgi:application"

[project.entry-points."docker"]
gunicorn = "wsgi:application"